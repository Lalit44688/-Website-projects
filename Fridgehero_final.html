<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fridge Hero</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 100%
    );
}

.container{
    width:100%;
    max-width:850px;
    padding:35px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    box-shadow:
    0 8px 32px rgba(0,0,0,0.18);
}

header{
    text-align:center;
    margin-bottom:30px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:2.5rem;
    color:white;
}

.subtitle{
    color:rgba(255,255,255,0.85);
    font-size:1rem;
    line-height:1.5;
}

.tagline{
    margin-top:10px;
    font-size:0.9rem;
    color:rgba(255,255,255,0.75);
    font-weight:500;
}

.input-section{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:8px;
    font-weight:600;
    color:white;
}

.input-group input{
    padding:16px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.9);
    color:#333;
    font-size:1rem;
    transition:all .3s ease;
}

.input-group input:hover{
    transform:translateY(-2px);
}

.input-group input:focus{
    outline:none;
    border-color:#ff9800;
    box-shadow:
    0 0 0 4px rgba(255,152,0,0.2);
}

#cookBtn{
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:12px;

    background:linear-gradient(
        135deg,
        #ff9f43,
        #ff7b00
    );

    color:white;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:.3s ease;
}

#cookBtn:hover{
    transform:translateY(-3px);
}

#cookBtn:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

#addIngredientBtn{
    padding:12px;
    border:none;
    border-radius:12px;
    background:#4caf50;
    color:white;
    cursor:pointer;
    font-weight:600;
}

#themeToggle{
    border:none;
    background:#f0f0f0;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

#errorMessage{
    color:#ffb3b3;
    text-align:center;
    font-weight:500;
}

.loading-section{
    text-align:center;
    margin-top:30px;
}

.loader{
    width:50px;
    height:50px;
    border:5px solid #e6e6e6;
    border-top:5px solid #667eea;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.recipe-card{
    margin-top:30px;
    padding:25px;
    border-radius:16px;

    background:#f8f9ff;

    border-left:6px solid #ff9800;
    border:1px solid #e3e6ff;
}

.recipe-card h2{
    text-align:center;
    margin-bottom:20px;
}

.recipe-content h3{
    margin-top:18px;
    margin-bottom:8px;
}

#dishName{
    color:#ff9800;
    font-size:2rem;
}

#description{
    line-height:1.8;
    margin-bottom:15px;
}

#recipeSteps{
    line-height:2;
    margin-bottom:15px;
    color:#333;
}

#servingTip{
    font-style:italic;
    line-height:1.8;
}

.recipe-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.recipe-actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#copyBtn{
    background:#2196f3;
    color:white;
}

#clearBtn{
    background:#f44336;
    color:white;
}

.hidden{
    display:none;
}

.dark-mode{
    background:
    linear-gradient(
        135deg,
        #1e1e2f,
        #121212
    );
}

.dark-mode .container{
    background:#222;
}

.dark-mode h1,
.dark-mode h2,
.dark-mode h3,
.dark-mode label{
    color:white;
}

.dark-mode .subtitle,
.dark-mode p{
    color:#d0d0d0;
}

.dark-mode input{
    background:#333;
    color:white;
    border-color:#444;
}

.dark-mode .recipe-card{
    background:#2b2b2b;
    border-color:#444;
}

.dark-mode #recipeSteps,
.dark-mode #description,
.dark-mode #servingTip{
    color:white;
}

.floating-food{
    position:fixed;
    font-size:3rem;
    opacity:0.15;
    pointer-events:none;
    animation:float 6s ease-in-out infinite;
}

.food2{
    top:15%;
    right:10%;
}

.food3{
    bottom:20%;
    left:8%;
}

.food4{
    bottom:10%;
    right:15%;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-20px);
    }
}

@media(max-width:768px){

    .container{
        padding:25px;
    }

    header h1{
        font-size:2rem;
    }

    #cookBtn{
        width:100%;
    }

    .recipe-actions{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<div class="floating-food">🍅</div>
<div class="floating-food food2">🥕</div>
<div class="floating-food food3">🧅</div>
<div class="floating-food food4">🥬</div>

<div class="container">

<header>

<div class="header-top">

<h1>🦸 Fridge Hero</h1>

<button id="themeToggle">
🌙
</button>

</div>

<p class="subtitle">
🥕 🍅 🧅 🥚 🧀

Turn fridge leftovers into
AI-powered recipes
</p>

<p class="tagline">
Save Food • Reduce Waste • Discover Recipes
</p>

</header>

<section class="input-section">

<div id="ingredientsContainer">

<div class="input-group">
<label>Ingredient 1</label>
<input
type="text"
class="ingredient-input"
placeholder="e.g. Tomato">
</div>

<div class="input-group">
<label>Ingredient 2</label>
<input
type="text"
class="ingredient-input"
placeholder="e.g. Onion">
</div>

<div class="input-group">
<label>Ingredient 3</label>
<input
type="text"
class="ingredient-input"
placeholder="e.g. Egg">
</div>

</div>

<button id="addIngredientBtn">
➕ Add Ingredient
</button>

<p id="errorMessage"></p>

<button id="cookBtn" type="button">
✨ Cook Magic
</button>

</section>

<section id="loading"
class="loading-section hidden">

<div class="loader"></div>

<p>
👨‍🍳 AI Chef is cooking...
</p>

</section>

<section id="recipeCard"
class="recipe-card hidden">

<h2 id="dishName">
Dish Name
</h2>

<div class="recipe-content">

<h3>📖 Description</h3>
<p id="description"></p>

<h3>👨‍🍳 Recipe</h3>
<div id="recipeSteps"></div>

<h3>🍽 Serving Tip</h3>
<p id="servingTip"></p>

<div class="recipe-actions">

<button id="copyBtn">
📋 Copy Recipe
</button>

<button id="clearBtn">
🗑 Clear Recipe
</button>

</div>

</div>

</section>

</div>

<script>

const API_KEY =
"Your api key here please";

const themeToggle =
document.getElementById("themeToggle");

const addIngredientBtn =
document.getElementById("addIngredientBtn");

const ingredientsContainer =
document.getElementById("ingredientsContainer");

const errorMessage =
document.getElementById("errorMessage");

const cookBtn =
document.getElementById("cookBtn");

const loadingSection =
document.getElementById("loading");

const recipeCard =
document.getElementById("recipeCard");

const dishName =
document.getElementById("dishName");

const description =
document.getElementById("description");

const recipeSteps =
document.getElementById("recipeSteps");

const servingTip =
document.getElementById("servingTip");

const copyBtn =
document.getElementById("copyBtn");

const clearBtn =
document.getElementById("clearBtn");

cookBtn.addEventListener(
"click",
generateRecipe
);

async function generateRecipe() {

const ingredientInputs =
document.querySelectorAll(
".ingredient-input"
);

const ingredients = [];

ingredientInputs.forEach(input => {

const value =
input.value.trim();

if(value !== ""){
ingredients.push(value);
}

});

if(ingredients.length < 3){

errorMessage.textContent =
"Please enter at least 3 ingredients.";

return;
}

errorMessage.textContent = "";

recipeCard.classList.add("hidden");

loadingSection.classList.remove(
"hidden"
);

cookBtn.disabled = true;

cookBtn.textContent =
"⏳ Cooking...";

try{

const prompt = `
You are a professional chef.

Using these ingredients:
${ingredients.join(", ")}

Return ONLY in this exact format:

Dish Name: [recipe name]

Description: [short description]

Recipe:
1. [step]
2. [step]
3. [step]

Serving Tip: [serving suggestion]

Do not use markdown.
Do not use ** symbols.
Do not add extra headings.
`;

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const data =
await response.json();

const recipe =
data.candidates[0]
.content.parts[0].text;

const dishMatch =
recipe.match(
/Dish Name:(.*?)(?=Description:|$)/s
);

const descriptionMatch =
recipe.match(
/Description:(.*?)(?=Recipe:|$)/s
);

const recipeMatch =
recipe.match(
/Recipe:(.*?)(?=Serving Tip:|$)/s
);

const tipMatch =
recipe.match(
/Serving Tip:(.*)/s
);

dishName.textContent =
dishMatch
? dishMatch[1].trim()
: "AI Generated Recipe";

description.textContent =
descriptionMatch
? descriptionMatch[1].trim()
: "";

recipeSteps.innerHTML =
recipeMatch
? recipeMatch[1]
.trim()
.replace(/\n/g,"<br>")
: "";

servingTip.textContent =
tipMatch
? tipMatch[1].trim()
: "";

loadingSection.classList.add(
"hidden"
);

cookBtn.disabled = false;

cookBtn.textContent =
"✨ Cook Magic";

recipeCard.classList.remove(
"hidden"
);

}catch(error){

console.error(error);

loadingSection.classList.add(
"hidden"
);

cookBtn.disabled = false;

cookBtn.textContent =
"✨ Cook Magic";

errorMessage.textContent =
"⚠ AI Chef is currently busy. Please try again.";

}

}

themeToggle.addEventListener(
"click",
() => {

document.body.classList.toggle(
"dark-mode"
);

if(
document.body.classList.contains(
"dark-mode"
)
){
themeToggle.textContent = "☀️";
}else{
themeToggle.textContent = "🌙";
}

}
);

let ingredientCount = 3;

addIngredientBtn.addEventListener(
"click",
() => {

if(ingredientCount >= 10){

errorMessage.textContent =
"Maximum 10 ingredients allowed.";

return;
}

ingredientCount++;

const div =
document.createElement("div");

div.classList.add(
"input-group"
);

div.innerHTML = `
<label>
Ingredient ${ingredientCount}
</label>

<input
type="text"
class="ingredient-input"
placeholder="Enter ingredient">
`;

ingredientsContainer.appendChild(
div
);

}
);

copyBtn.addEventListener(
"click",
() => {

const text = `
${dishName.textContent}

${description.textContent}

${recipeSteps.textContent}

Serving Tip:
${servingTip.textContent}
`;

navigator.clipboard.writeText(
text
);

alert(
"Recipe copied successfully!"
);

}
);

clearBtn.addEventListener(
"click",
() => {

recipeCard.classList.add(
"hidden"
);

dishName.textContent = "";
description.textContent = "";
recipeSteps.innerHTML = "";
servingTip.textContent = "";

}
);

</script>

</body>
</html>
